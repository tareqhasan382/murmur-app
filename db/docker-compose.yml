version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: murmur-mysql
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: murmur_db
      MYSQL_USER: murmur_user
      MYSQL_PASSWORD: murmur_pass

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d

volumes:
  mysql_data:
